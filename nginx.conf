server {
    listen 80;

    # Serve the React SPA
    root /usr/share/nginx/html;
    index index.html;

    # Proxy /products* → product ClusterIP service
    location /products {
        proxy_pass http://product:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy /orders* → order ClusterIP service
    location /orders {
        proxy_pass http://order:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Nginx stub status for Prometheus nginx-exporter
    location /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
    }

    # All other requests → React app (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
