server {
    listen 80;

    # Serve the React SPA
    root /usr/share/nginx/html;
    index index.html;

    # Proxy /products* → product-service
    location /products {
        proxy_pass http://product-service:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy /orders* → order-service
    location /orders {
        proxy_pass http://order-service:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # All other requests → React app (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
